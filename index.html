<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Ontario Traffic Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 London Ontario Traffic</h1>
            <p>Daily traffic volume by street</p>
        </header>
        
        <div class="controls">
            <div class="filter-group">
                <label for="traffic-filter">Traffic Level:</label>
                <select id="traffic-filter">
                    <option value="all">All Traffic</option>
                    <option value="low">Low (0-5,000)</option>
                    <option value="medium">Medium (5,000-15,000)</option>
                    <option value="high">High (15,000+)</option>
                </select>
            </div>
            <button id="reset-view" class="btn">Reset View</button>
        </div>
        
        <div id="map"></div>
        
        <div class="legend">
            <h3>Daily Traffic Volume</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="color-box low"></span>
                    <span>Low (0-5K)</span>
                </div>
                <div class="legend-item">
                    <span class="color-box medium"></span>
                    <span>Medium (5K-15K)</span>
                </div>
                <div class="legend-item">
                    <span class="color-box high"></span>
                    <span>High (15K+)</span>
                </div>
            </div>
        </div>
        
        <footer>
            <p>Data: <a href="https://opendata.london.ca/" target="_blank">City of London Open Data</a></p>
            <p>Built with <a href="https://leafletjs.com/" target="_blank">Leaflet</a></p>
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
