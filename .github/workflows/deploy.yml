name: Refresh data and deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # The City updates the layer about once a year. A monthly check keeps the
    # deployed snapshot fresh without hammering their service.
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh City traffic snapshot
        continue-on-error: true
        run: npm run fetch-data

      - name: Test
        run: npm test

      - name: Commit refreshed snapshot
        continue-on-error: true
        run: |
          if ! git diff --quiet -- data/traffic.geojson; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Refresh City of London traffic snapshot"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
